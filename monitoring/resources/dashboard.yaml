apiVersion: v1
kind: ConfigMap
metadata:
  name: python-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  python-platform.json: |
    {
      "uid": "python-platform",
      "title": "Python GKE Platform",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "refresh": "15s",
      "tags": [
        "python-platform"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=~\"$namespace\",service=\"python-platform\",path!~\"/healthz|/ready\"}[2m]))",
              "legendFormat": "RPS"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx responses",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * ((sum(rate(http_requests_total{namespace=~\"$namespace\",service=\"python-platform\",status_code=~\"5..\",path!~\"/healthz|/ready\"}[2m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",service=\"python-platform\",path!~\"/healthz|/ready\"}[2m])), 0.001))",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\",service=\"python-platform\",path!~\"/healthz|/ready\"}[2m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\",service=\"python-platform\",path!~\"/healthz|/ready\"}[2m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\",service=\"python-platform\",path!~\"/healthz|/ready\"}[2m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "CPU usage per pod",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"python-platform-.*\",container=\"app\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Memory working set",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"python-platform-.*\",container=\"app\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU throttled periods",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\"$namespace\",pod=~\"python-platform-.*\",container=\"app\"}[2m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=~\"$namespace\",pod=~\"python-platform-.*\",container=\"app\"}[2m])), 0.001)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "PVC used",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * max by (namespace) (kubelet_volume_stats_used_bytes{namespace=~\"$namespace\",persistentvolumeclaim=\"python-platform-data\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\",persistentvolumeclaim=\"python-platform-data\"})",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory limit usage",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * max by (namespace,pod,container) (container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"python-platform-.*\",container=\"app\"}) / on(namespace,pod,container) max by (namespace,pod,container) (kube_pod_container_resource_limits{namespace=~\"$namespace\",pod=~\"python-platform-.*\",container=\"app\",resource=\"memory\",unit=\"byte\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus"
          },
          {
            "name": "namespace",
            "type": "custom",
            "query": "platform-staging,platform-production",
            "current": {
              "text": "platform-staging",
              "value": "platform-staging"
            },
            "multi": false,
            "includeAll": false
          }
        ]
      }
    }
